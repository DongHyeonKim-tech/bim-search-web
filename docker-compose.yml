services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME required}:${IMAGE_TAG:?IMAGE_TAG required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:?BUILD_ENV required}
    ports:
      - "0.0.0.0:${HOST_PORT:?HOST_PORT required}:3000"
    env_file:
      - ${RUNTIME_ENV_FILE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
